<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rifa da Maitê 👶</title>

<style>
body{
  margin:0;
  background:#0d0d0d;
  font-family:Arial;
  color:#fff;
  text-align:center;
}

h1{
  margin:20px 0 10px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:6px;
  padding:10px;
  max-width:500px;
  margin:auto;
}

/* NÚMEROS */
.numero{
  aspect-ratio:1/1;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#1f1f1f;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  transition:0.2s;
}

.numero:hover{
  transform:scale(1.05);
  background:#333;
}

.reservado{
  background:#ffc107;
  color:#000;
}

.pago{
  background:#28a745;
}

/* FORM */
#form{
  position:fixed;
  bottom:0;
  width:100%;
  background:#fff;
  color:#000;
  padding:15px;
  display:none;
}

input{
  width:100%;
  margin:5px 0;
  padding:10px;
}
</style>
</head>

<body>

<h1>🎟️ Rifa da Maitê</h1>

<div class="grid" id="grid"></div>

<div id="form">
  <h3 id="num"></h3>
  <input id="nome" placeholder="Seu nome">
  <input id="whats" placeholder="WhatsApp">
  <button onclick="reservar()">Reservar</button>
  <button onclick="fecharForm()">Cancelar</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
// ADMIN
const params = new URLSearchParams(window.location.search);
const isAdmin = params.get("admin") === "123";

// FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyDT8hvEal...",
  authDomain: "rifa-maite.firebaseapp.com",
  databaseURL: "https://rifa-maite-default-rtdb.firebaseio.com",
  projectId: "rifa-maite"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const grid = document.getElementById("grid");
let selecionado = null;

// CRIAR GRID
for(let i=1;i<=100;i++){

  let num = i.toString().padStart(2,'0');

  let div = document.createElement("div");
  div.className = "numero";
  div.innerText = num;
  div.dataset.num = num;

  div.onclick = ()=>clicar(div,num);

  div.oncontextmenu = (e)=>{
    e.preventDefault();
    if(isAdmin){
      db.ref("rifa/"+num).remove();
    }
  };

  grid.appendChild(div);
}

// STATUS TEMPO REAL
db.ref("rifa").on("value", snap=>{
  let data = snap.val() || {};

  document.querySelectorAll(".numero").forEach(div=>{
    let num = div.dataset.num;

    div.classList.remove("reservado","pago");

    if(data[num]){
      div.classList.add(
        data[num].status === "pago" ? "pago" : "reservado"
      );
    }
  });
});

// CLICK
function clicar(div,num){

  if(isAdmin){
    db.ref("rifa/"+num).once("value").then(snap=>{
      if(!snap.exists()) return;

      let status = snap.val().status;

      db.ref("rifa/"+num).update({
        status: status==="reservado" ? "pago" : "reservado"
      });
    });
    return;
  }

  if(div.classList.contains("reservado") || div.classList.contains("pago")) return;

  selecionado = num;
  document.getElementById("form").style.display="block";
  document.getElementById("num").innerText = "Número "+num;
}

// RESERVAR
function reservar(){
  let nome = document.getElementById("nome").value;
  let whats = document.getElementById("whats").value;

  if(!nome || !whats){
    alert("Preencha tudo");
    return;
  }

  let ref = db.ref("rifa/"+selecionado);

  ref.once("value").then(snap=>{
    if(snap.exists()){
      alert("Número já escolhido!");
      return;
    }

    ref.set({
      nome,
      whats,
      status:"reservado"
    });

    window.open(`https://wa.me/5548988407996?text=Escolhi o número ${selecionado} na rifa 👶`);

    fecharForm();
  });
}

function fecharForm(){
  document.getElementById("form").style.display="none";
}
</script>

</body>
</html>
