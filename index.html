<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rifa da Maitê 👶</title>

<style>
body{
  margin:0;
  background:#000;
  font-family:Arial;
}

.board{
  position:relative;
  width:100%;
  max-width:1000px;
  margin:auto;
}

.board img{
  width:100%;
  display:block;
}

.numero{
  position:absolute;
  width:3.8%;
  height:5.5%;
  cursor:pointer;
}

.numero:hover{
  background:rgba(255,255,255,0.25);
  border-radius:6px;
}

.reservado{
  background:rgba(255,229,153,0.7);
  border-radius:6px;
}

.pago{
  background:rgba(182,215,168,0.8);
  border-radius:6px;
}

#form{
  position:fixed;
  bottom:0;
  width:100%;
  background:#fff;
  padding:15px;
  display:none;
}

.adminBar{
  position:fixed;
  top:0;
  width:100%;
  background:#000;
  color:#fff;
  text-align:center;
  padding:5px;
  display:none;
}

/* painel ajuste */
#ajusteBox{
  position:fixed;
  right:10px;
  top:10px;
  background:#fff;
  padding:10px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,0.3);
  z-index:9999;
  font-size:12px;
}
</style>
</head>

<body>

<div id="ajusteBox">
<b>AJUSTE</b><br>

X: <button onclick="startX--">-</button>
<button onclick="startX++">+</button><br>

Y: <button onclick="startY--">-</button>
<button onclick="startY++">+</button><br>

W: <button onclick="largura--">-</button>
<button onclick="largura++">+</button><br>

H: <button onclick="altura--">-</button>
<button onclick="altura++">+</button><br>

<button onclick="atualizar()">APLICAR</button>
</div>

<div id="adminBar" class="adminBar">🔐 MODO ADMIN</div>

<div class="board" id="board">
  <img src="arte.png">
</div>

<div id="form">
  <h3 id="num"></h3>
  <input id="nome" placeholder="Seu nome">
  <input id="whats" placeholder="WhatsApp">
  <button onclick="reservar()">Reservar</button>
  <button onclick="fecharForm()">Cancelar</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
// 🔐 ADMIN
const params = new URLSearchParams(window.location.search);
const isAdmin = params.get("admin") === "123";

if(isAdmin){
  document.getElementById("adminBar").style.display="block";
}

// 🔥 FIREBASE (COLOCA SUA KEY)
const firebaseConfig = {
  apiKey: "AIzaSyDT8hvEal...",
  authDomain: "rifa-maite.firebaseapp.com",
  databaseURL: "https://rifa-maite-default-rtdb.firebaseio.com",
  projectId: "rifa-maite"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const board = document.getElementById("board");

let selecionado = null;

// 🔧 CONFIG PADRÃO
let startX = 52;
let startY = 18;
let largura = 42;
let altura = 68;

// 🔥 CARREGAR CONFIG ONLINE
db.ref("config").on("value", snap=>{
  if(snap.exists()){
    const cfg = snap.val();
    startX = cfg.startX;
    startY = cfg.startY;
    largura = cfg.largura;
    altura = cfg.altura;
  }
  renderGrid();
});

// 🎯 CRIAR GRID
function renderGrid(){

  board.innerHTML = '<img src="arte.png">';

  let gapX = largura / 10;
  let gapY = altura / 10;

  let count = 1;

  for(let y=0;y<10;y++){
    for(let x=0;x<10;x++){

      let num = count.toString().padStart(2,'0');

      let div = document.createElement("div");
      div.className="numero";
      div.innerText = num;

      div.style.left = (startX + x*gapX) + "%";
      div.style.top = (startY + y*gapY) + "%";
      div.style.width = (gapX * 0.8) + "%";
      div.style.height = (gapY * 0.8) + "%";

      div.onclick = () => clicar(div,num);

      div.oncontextmenu = (e)=>{
        e.preventDefault();
        if(isAdmin){
          if(confirm("Liberar número "+num+"?")){
            db.ref("rifa/"+num).remove();
          }
        }
      };

      board.appendChild(div);
      count++;
    }
  }
}

// 🔄 STATUS EM TEMPO REAL
db.ref("rifa").on("value", snap=>{
  const data = snap.val() || {};

  document.querySelectorAll(".numero").forEach(div=>{
    let num = div.innerText;

    div.classList.remove("reservado","pago");

    if(data[num]){
      div.classList.add(
        data[num].status === "pago" ? "pago" : "reservado"
      );
    }
  });
});

// 👆 CLICK
function clicar(div,num){

  if(isAdmin){
    db.ref("rifa/"+num).once("value").then(snap=>{
      if(!snap.exists()) return;

      let status = snap.val().status;

      db.ref("rifa/"+num).update({
        status: status==="reservado" ? "pago" : "reservado"
      });
    });
    return;
  }

  if(div.classList.contains("reservado") || div.classList.contains("pago")) return;

  selecionado = num;
  document.getElementById("form").style.display="block";
  document.getElementById("num").innerText = "Número "+num;
}

// 💾 SALVAR AJUSTE
function atualizar(){

  if(isAdmin){
    db.ref("config").set({
      startX,
      startY,
      largura,
      altura
    });
  }

  console.log("CONFIG SALVA:");
  console.log(startX, startY, largura, altura);
}

// 📲 RESERVAR
function reservar(){
  let nome = document.getElementById("nome").value;
  let whats = document.getElementById("whats").value;

  if(!nome || !whats){
    alert("Preencha tudo");
    return;
  }

  let ref = db.ref("rifa/"+selecionado);

  ref.once("value").then(snap=>{
    if(snap.exists()){
      alert("Número já escolhido!");
      return;
    }

    ref.set({
      nome,
      whats,
      status:"reservado"
    });

    window.open(`https://wa.me/5548988407996?text=Olá! Escolhi o número ${selecionado} na rifa da Maitê 😊`);

    fecharForm();
  });
}

function fecharForm(){
  document.getElementById("form").style.display="none";
}
</script>

</body>
</html>
