<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rifa da Maitê 👶</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#fdf6f0;
  text-align:center;
}

h1{ color:#c27ba0; }

.grid{
  display:grid;
  grid-template-columns: repeat(10,1fr);
  gap:6px;
  padding:10px;
  max-width:600px;
  margin:auto;
}

.numero{
  padding:12px;
  border-radius:10px;
  background:#fff;
  cursor:pointer;
  border:1px solid #ddd;
  transition:0.2s;
}

.numero:hover{ transform:scale(1.05); }

.reservado{ background:#ffe599; }
.pago{ background:#b6d7a8; }

#form{
  position:fixed;
  bottom:0;
  width:100%;
  background:#fff;
  padding:15px;
  display:none;
}

input{
  width:90%;
  padding:10px;
  margin:5px;
}

button{
  padding:12px;
  width:90%;
  background:#e06666;
  color:#fff;
  border:none;
  border-radius:10px;
}

.adminBar{
  background:#000;
  color:#fff;
  padding:5px;
  font-size:12px;
}
</style>
</head>

<body>

<div id="adminBar" class="adminBar" style="display:none;">
  🔐 MODO ADMIN ATIVO
</div>

<h1>👶 Rifa da Maitê</h1>
<p>1 fralda ou mimo</p>

<div class="grid" id="grid"></div>

<div id="form">
  <h3 id="num"></h3>
  <input id="nome" placeholder="Seu nome">
  <input id="whats" placeholder="WhatsApp">
  <button onclick="reservar()">Reservar</button>
  <button onclick="fecharForm()">Cancelar</button>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
// 🔐 detectar admin
const isAdmin = window.location.search.includes("admin=123");

if(isAdmin){
  document.getElementById("adminBar").style.display="block";
}

const firebaseConfig = {
  apiKey: "AIzaSyDT8hvEal...",
  authDomain: "rifa-maite.firebaseapp.com",
  databaseURL: "https://rifa-maite-default-rtdb.firebaseio.com",
  projectId: "rifa-maite"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const grid = document.getElementById("grid");
let selecionado = null;

// criar números
for(let i=1;i<=100;i++){
  let num = i.toString().padStart(2,'0');

  let div = document.createElement("div");
  div.className="numero";
  div.innerText = num;

  div.onclick = () => clickNumero(div, num);
  div.oncontextmenu = (e) => {
    e.preventDefault();
    if(isAdmin) liberar(num);
  };

  grid.appendChild(div);
}

// clique
function clickNumero(div, num){
  if(isAdmin){
    const ref = db.ref("rifa/"+num);

    ref.once("value").then(snap=>{
      if(!snap.exists()) return;

      const data = snap.val();

      if(data.status === "reservado"){
        ref.update({status:"pago"});
      } else {
        ref.update({status:"reservado"});
      }
    });

    return;
  }

  if(div.classList.contains("reservado") || div.classList.contains("pago")) return;

  selecionado = num;
  document.getElementById("form").style.display="block";
  document.getElementById("num").innerText = "Número "+num;
}

// atualizar tela
db.ref("rifa").on("value", snap=>{
  const data = snap.val() || {};

  document.querySelectorAll(".numero").forEach(div=>{
    const num = div.innerText;

    div.classList.remove("reservado","pago");

    if(data[num]){
      if(data[num].status === "pago"){
        div.classList.add("pago");
      } else {
        div.classList.add("reservado");
      }
    }
  });
});

// reservar
function reservar(){
  const nome = document.getElementById("nome").value;
  const whats = document.getElementById("whats").value;

  if(!nome || !whats){
    alert("Preencha tudo");
    return;
  }

  const ref = db.ref("rifa/"+selecionado);

  ref.once("value").then(snap=>{
    if(snap.exists()){
      alert("Número já escolhido!");
      return;
    }

    ref.set({
      nome,
      whats,
      status:"reservado"
    });

    window.open(`https://wa.me/5548988407996?text=Escolhi o número ${selecionado} na rifa 😊`);

    fecharForm();
  });
}

// liberar número
function liberar(num){
  if(confirm("Liberar número "+num+"?")){
    db.ref("rifa/"+num).remove();
  }
}

function fecharForm(){
  document.getElementById("form").style.display="none";
}
</script>

</body>
</html>
