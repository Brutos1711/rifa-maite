<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rifa da Maitê 👶</title>

<style>
body{
  margin:0;
  background:#000;
}

/* ÁREA TOTAL */
.board{
  position:relative;
  width:100vw;
  height:100vh;
}

/* IMAGEM */
.board img{
  width:100%;
  height:100%;
  object-fit:contain;
}

/* NÚMEROS */
.numero{
  position:absolute;
  display:flex;
  align-items:center;
  justify-content:center;

  font-size:12px;
  border-radius:8px;

  background:rgba(255,255,255,0.7);
  border:1px solid #ccc;

  cursor:pointer;
}

.reservado{ background:#ffe599; }
.pago{ background:#b6d7a8; }

/* FORM */
#form{
  position:fixed;
  bottom:0;
  width:100%;
  background:#fff;
  padding:15px;
  display:none;
}

/* ADMIN */
.adminBar{
  position:fixed;
  top:0;
  width:100%;
  background:#000;
  color:#fff;
  text-align:center;
  padding:5px;
  display:none;
}
</style>
</head>

<body>

<div id="adminBar" class="adminBar">🔐 MODO ADMIN</div>

<div class="board">
  <img src="arte.png">
</div>

<div id="form">
  <h3 id="num"></h3>
  <input id="nome" placeholder="Seu nome">
  <input id="whats" placeholder="WhatsApp">
  <button onclick="reservar()">Reservar</button>
  <button onclick="fecharForm()">Cancelar</button>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
// 🔐 ADMIN
const params = new URLSearchParams(window.location.search);
const isAdmin = params.get("admin") === "123";
if(isAdmin){
  document.getElementById("adminBar").style.display="block";
}

// 🔥 FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyDT8hvEal...",
  authDomain: "rifa-maite.firebaseapp.com",
  databaseURL: "https://rifa-maite-default-rtdb.firebaseio.com",
  projectId: "rifa-maite"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const board = document.querySelector(".board");
let selecionado = null;

// 🔥 AJUSTE DA TABELA (MEXE SÓ AQUI)
let startX = 52;
let startY = 18;
let largura = 42;
let altura = 68;

// CALCULO
let gapX = largura / 10;
let gapY = altura / 10;

// CRIAR NÚMEROS
let count = 1;

for(let y=0;y<10;y++){
  for(let x=0;x<10;x++){

    let num = count.toString().padStart(2,'0');

    let div = document.createElement("div");
    div.className="numero";
    div.innerText = num;

    div.style.left = (startX + x*gapX) + "%";
    div.style.top = (startY + y*gapY) + "%";
    div.style.width = (gapX * 0.8) + "%";
    div.style.height = (gapY * 0.8) + "%";

    div.onclick = () => clicar(div,num);

    div.oncontextmenu = (e)=>{
      e.preventDefault();
      if(isAdmin){
        if(confirm("Liberar número "+num+"?")){
          db.ref("rifa/"+num).remove();
        }
      }
    };

    board.appendChild(div);
    count++;
  }
}

// ATUALIZAR STATUS
db.ref("rifa").on("value", snap=>{
  const data = snap.val() || {};

  document.querySelectorAll(".numero").forEach(div=>{
    let num = div.innerText;

    div.classList.remove("reservado","pago");

    if(data[num]){
      div.classList.add(data[num].status==="pago" ? "pago" : "reservado");
    }
  });
});

// CLIQUE
function clicar(div,num){

  if(isAdmin){
    db.ref("rifa/"+num).once("value").then(snap=>{
      if(!snap.exists()) return;

      let status = snap.val().status;

      db.ref("rifa/"+num).update({
        status: status==="reservado" ? "pago" : "reservado"
      });
    });
    return;
  }

  if(div.classList.contains("reservado") || div.classList.contains("pago")) return;

  selecionado = num;
  document.getElementById("form").style.display="block";
  document.getElementById("num").innerText = "Número "+num;
}

// RESERVAR
function reservar(){
  let nome = document.getElementById("nome").value;
  let whats = document.getElementById("whats").value;

  if(!nome || !whats){
    alert("Preencha tudo");
    return;
  }

  let ref = db.ref("rifa/"+selecionado);

  ref.once("value").then(snap=>{
    if(snap.exists()){
      alert("Número já escolhido!");
      return;
    }

    ref.set({nome, whats, status:"reservado"});

    window.open(`https://wa.me/5548988407996?text=Olá! Escolhi o número ${selecionado} na rifa da Maitê 😊`);

    fecharForm();
  });
}

function fecharForm(){
  document.getElementById("form").style.display="none";
}
</script>

</body>
</html>
