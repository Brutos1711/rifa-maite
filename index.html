<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rifa da Maitê 👶</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f7d6e0; /* rosa médio suave */
}

/* LAYOUT */
.container{
  display:flex;
  flex-wrap:wrap;
}

/* LATERAL */
.sidebar{
  width:280px;
  background:#f7d6e0;
  padding:20px;
  box-sizing:border-box;
  border-right:2px solid #f0bccc;
}

.sidebar h2{
  text-align:center;
  margin-top:0;
  font-size:22px;
}

.info{
  font-size:14px;
  margin-bottom:14px;
  line-height:1.5;
}

.bloco{
  background:#fff;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
}

/* GRID */
.main{
  flex:1;
  padding:15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:6px;
  max-width:500px;
  margin:auto;
}

.numero{
  aspect-ratio:1/1;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  transition:0.2s;
}

.numero:hover{
  transform:scale(1.05);
  background:#f0bccc;
}

.reservado{
  background:#ffe082;
  color:#000;
}

.pago{
  background:#ec87a6;
  color:#fff;
}

/* FORM */
#form{
  position:fixed;
  bottom:0;
  width:100%;
  background:#fff;
  padding:15px;
  display:none;
}

input{
  width:100%;
  margin:5px 0;
  padding:10px;
}

/* MOBILE */
@media(max-width:700px){
  .sidebar{
    width:100%;
    border-right:none;
    border-bottom:2px solid #f0bccc;
  }
}
</style>
</head>

<body>

<div class="container">

<!-- LATERAL -->
<div class="sidebar">

<h2>🎀 Rifa da Maitê</h2>

<div class="bloco">
🍼 <b>P (Pequena)</b><br>01 a 20
</div>

<div class="bloco">
👶 <b>M (Média)</b><br>21 a 60
</div>

<div class="bloco">
💖 <b>G (Grande)</b><br>61 a 90
</div>

<div class="bloco">
🌸 <b>GG (Extra G)</b><br>91 a 100
</div>

<div class="bloco">
🐷 <b>Prêmio:</b><br>R$300 no PIX
</div>

<div class="bloco">
🎁 <b>Valor:</b><br>
1 pacote de fraldas<br>ou 1 mimo
</div>

<div class="bloco">
📱 <b>WhatsApp:</b><br>
(48) 98445-0593
</div>

<div class="bloco">
📅 <b>Sorteio:</b><br>
Após vender todos os números
</div>

<div class="info" style="text-align:center;">
Muito obrigado 💖<br>
<b>Maitê</b>
</div>

</div>

<!-- GRID -->
<div class="main">
  <div class="grid" id="grid"></div>
</div>

</div>

<!-- FORM -->
<div id="form">
  <h3 id="num"></h3>
  <input id="nome" placeholder="Seu nome">
  <input id="whats" placeholder="WhatsApp">
  <button onclick="reservar()">Reservar</button>
  <button onclick="fecharForm()">Cancelar</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
// 🔐 ADMIN ESCONDIDO
const params = new URLSearchParams(window.location.search);
const isAdmin = params.get("admin") === "123";

// FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyDT8hvEal...",
  authDomain: "rifa-maite.firebaseapp.com",
  databaseURL: "https://rifa-maite-default-rtdb.firebaseio.com",
  projectId: "rifa-maite"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const grid = document.getElementById("grid");
let selecionado = null;

// GRID
for(let i=1;i<=100;i++){

  let num = i.toString().padStart(2,'0');

  let div = document.createElement("div");
  div.className = "numero";
  div.innerText = num;
  div.dataset.num = num;

  div.onclick = ()=>clicar(div,num);

  // ADMIN: botão direito libera
  div.oncontextmenu = (e)=>{
    e.preventDefault();
    if(isAdmin){
      if(confirm("Liberar número "+num+"?")){
        db.ref("rifa/"+num).remove();
      }
    }
  };

  grid.appendChild(div);
}

// STATUS
db.ref("rifa").on("value", snap=>{
  let data = snap.val() || {};

  document.querySelectorAll(".numero").forEach(div=>{
    let num = div.dataset.num;

    div.classList.remove("reservado","pago");

    if(data[num]){
      div.classList.add(
        data[num].status === "pago" ? "pago" : "reservado"
      );
    }
  });
});

// CLICK
function clicar(div,num){

  // ADMIN: alterna status
  if(isAdmin){
    db.ref("rifa/"+num).once("value").then(snap=>{
      if(!snap.exists()) return;

      let status = snap.val().status;

      db.ref("rifa/"+num).update({
        status: status==="reservado" ? "pago" : "reservado"
      });
    });
    return;
  }

  if(div.classList.contains("reservado") || div.classList.contains("pago")) return;

  selecionado = num;
  document.getElementById("form").style.display="block";
  document.getElementById("num").innerText = "Número "+num;
}

// RESERVAR
function reservar(){
  let nome = document.getElementById("nome").value;
  let whats = document.getElementById("whats").value;

  if(!nome || !whats){
    alert("Preencha tudo");
    return;
  }

  let ref = db.ref("rifa/"+selecionado);

  ref.once("value").then(snap=>{
    if(snap.exists()){
      alert("Número já escolhido!");
      return;
    }

    ref.set({
      nome,
      whats,
      status:"reservado"
    });

    window.open(`https://wa.me/5548984450593?text=Escolhi o número ${selecionado} na rifa 👶`);

    fecharForm();
  });
}

function fecharForm(){
  document.getElementById("form").style.display="none";
}
</script>

</body>
</html>
